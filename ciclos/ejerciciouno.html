<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ejercicio Ciclos</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <div class="contenedor">
    <h1>Generador de Números Pares e Impares</h1>
    <label for="numero">Ingresa un número:</label>
    <input type="number" id="numero" min="1" value="10" />
    <button onclick="generarListas()">Generar Listas</button>

    <div class="resultados">
      <div id="pares">
        <h2>Números Pares (con <code>for</code>)</h2>
        <ul id="lista-pares"></ul>
      </div>

      <div id="impares">
        <h2>Números Impares (con <code>while</code>)</h2>
        <ul id="lista-impares"></ul>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
