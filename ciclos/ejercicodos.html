<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Dados</title>
  <link rel="stylesheet" href="css/estilo2.css" />
</head>
<body>
  <div class="contenedor">
    <h1>🎲 Simulador de Lanzamiento de Dados</h1>
    <label for="lanzamientos">¿Cuántas veces lanzar el dado? (1–100)</label>
    <input type="number" id="lanzamientos" min="1" max="100" value="10" />
    <button onclick="lanzarDados()">¡Lanzar!</button>

    <div class="resultados" id="resultados">
      <h2>Resultados:</h2>
      <p id="lista-resultados"></p>
      <p id="total-seis"></p>
    </div>
  </div>

  <script src="js/main2.js"></script>
</body>
</html>
